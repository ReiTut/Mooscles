          # (:screens androidHostTest) SearchTermsDriftTest 2. 830 + 19 = 849.
          # Task 3 fix round 1 (:shared androidHostTest): ExerciseSearchIndexJvmTest 1 (the exhaustive
          # legacy check moved off iOS; the commonTest one now samples). 849 + 1 = 850.
          # Merged Task 4 + Task 3: 830 + 6 + 20 = 856.
          # Phase 4A task 5 (:designsystem commonTest): FigureGeometryTest 5, IllustrationTokensTest 2,
          # ComponentColorsTest +1. 815 + 8 = 823.
          # Merged Tasks 2–5: 815 + 15 (T2) + 6 (T4) + 20 (T3) + 8 (T5) = 864.

          # Phase 4B task 2 fix round 1 (:app): RoutineCommandsPersistenceTest +3. 972 + 3 = 975.
          # Phase 4B task 3 (:app): AppViewModelRoutinesHostTest 11, RoutineCommandsPersistenceTest +2;
          # (:shared commonTest) WorkoutPresentationTest +10, UiErrorsTest +1. 975 + 24 = 999.
          # Phase 4B task 7 (:app, sdk [26, 35] runs each method twice): ExercisePhotoStoreHostTest 13 x 2 = 26,

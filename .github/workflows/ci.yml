          # :app ShellNavigationHostTest +2, WorkoutSharePreviewHostTest -1; :shared WorkoutPresentationTest +1,
          # InProcessRestTimerTest +1. 807 + 3 + 1 + 2 = 813.
          # Ring iOS fix (:designsystem commonTest): RestTimerRingMathTest +1.
          # Merged with the ring fix: 813 + 1 = 814.
          # +1: in-process rest completion retry test
          # Phase 4A task 2 (:shared commonTest): ExerciseAnatomyTest 15. 815 + 15 = 830.
          # Phase 4A task 4 (:app host): CustomExerciseIdTest 4, AppViewModelCustomExerciseHostTest 2. 830 + 6 = 836.
